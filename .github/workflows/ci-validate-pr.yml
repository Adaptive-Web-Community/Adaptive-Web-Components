name: Validate PRs

on:
  push:
    branches:
      - main
      - releases/*
  pull_request:
    branches:
      - main
      - releases/*
      - features/*

jobs:
  build_linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install package dependencies
        run: npm ci --ignore-scripts

      - name: Build all packages
        run: npm run build

      - name: Validate workspaces
        run: npm run test
